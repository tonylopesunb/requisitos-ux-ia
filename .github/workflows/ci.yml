name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      banco:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: requisitos
          POSTGRES_PASSWORD: requisitos
          POSTGRES_DB: requisitos_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U requisitos"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://requisitos:requisitos@localhost:5432/requisitos_teste
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dados fictícios íntegros
        run: python3 dados-ficticios/validar.py
        working-directory: .
